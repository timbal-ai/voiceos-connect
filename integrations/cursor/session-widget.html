<!doctype html>
<meta charset="utf-8" />
<style>
  * { scrollbar-width: none; box-sizing: border-box; }
  ::-webkit-scrollbar { display: none; }
  :root { --k-radius:26px; --ink:rgba(255,255,255,.96); --sub:rgba(255,255,255,.46);
          --line:rgba(255,255,255,.09); --add:#3fb950; --del:#f85149; --accent:#8b5cf6;
          --chip:rgba(255,255,255,.05); --term:rgba(255,255,255,.035); --run:#e3b341; }
  html[data-theme="light"] { --ink:rgba(0,0,0,.92); --sub:rgba(0,0,0,.46);
          --line:rgba(0,0,0,.10); --chip:rgba(0,0,0,.05); --term:rgba(0,0,0,.035); }
  body { margin:0; background:transparent; color:var(--ink);
         font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; }
  .card { padding:13px 14px 14px; }
  .top { display:flex; align-items:center; gap:9px; margin-bottom:11px; }
  .logo { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,#a78bfa,#6d28d9);
          display:grid; place-items:center; flex:none; box-shadow:0 0 16px rgba(139,92,246,.45); }
  .logo svg { width:13px; height:13px; }
  .ttl { font-weight:650; letter-spacing:.2px; }
  .trail { margin-left:auto; font-size:10.5px; color:var(--sub); text-transform:uppercase;
           letter-spacing:.6px; display:flex; align-items:center; gap:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--run); box-shadow:0 0 8px var(--run); }
  .dot.done { background:var(--add); box-shadow:0 0 8px var(--add); animation:none; }
  .dot.run { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .repo { font-size:11.5px; color:var(--sub); margin:-4px 0 11px 31px; font-variant-numeric:tabular-nums; }
  .term { background:var(--term); border:1px solid var(--line); border-radius:12px;
          padding:10px 12px; font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
          max-height:190px; overflow:auto; }
  .ln { display:flex; align-items:center; gap:8px; opacity:0; transform:translateX(-4px);
        transition:opacity .28s ease, transform .28s ease; white-space:nowrap; }
  .ln.in { opacity:1; transform:none; }
  .g { flex:none; width:13px; text-align:center; color:var(--sub); }
  .g.ok { color:var(--add); } .g.now { color:var(--run); }
  .ltxt { overflow:hidden; text-overflow:ellipsis; }
  .caret { display:inline-block; width:7px; height:14px; background:var(--run); margin-left:2px;
           vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50%{opacity:0} }
  .fin { margin-top:12px; }
  .counts { display:flex; align-items:baseline; gap:13px; margin-bottom:9px; }
  .num { font-size:23px; font-weight:680; font-variant-numeric:tabular-nums; }
  .num.add{color:var(--add)} .num.del{color:var(--del)}
  .num small{font-size:13px;opacity:.7;margin-right:1px}
  .fcount{font-size:13px;color:var(--sub);font-weight:500}
  .bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;display:flex;margin-bottom:11px}
  .bar i{height:100%;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .bar .ba{background:var(--add)} .bar .bd{background:var(--del)}
  .files{display:flex;flex-direction:column;gap:6px}
  .f{display:flex;align-items:center;gap:9px;opacity:0;transform:translateY(5px);
     transition:opacity .32s ease,transform .32s ease}
  .f.in{opacity:1;transform:none}
  .fname{font:12px/1.4 ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .fbar{width:60px;height:5px;border-radius:3px;background:var(--chip);overflow:hidden;display:flex;flex:none}
  .fbar i{height:100%} .fbar .ba{background:var(--add)} .fbar .bd{background:var(--del)}
  .fnum{font:11px/1 ui-monospace,Menlo,monospace;color:var(--sub);flex:none;min-width:54px;text-align:right}
  .fnum b{color:var(--add);font-weight:600} .fnum s{color:var(--del);text-decoration:none}
  .pr{margin-top:12px;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;
      background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;border:none;cursor:pointer;
      box-shadow:0 4px 14px rgba(139,92,246,.4)}
  .pr:active{transform:translateY(1px)}
</style>
<div class="card">
  <div class="top">
    <span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5l8-2 8 2-8 4-8-4z" fill="#fff" opacity=".95"/><path d="M4 5v10l8 4V9L4 5z" fill="#fff" opacity=".7"/><path d="M20 5v10l-8 4V9l8-4z" fill="#fff" opacity=".85"/></svg></span>
    <span class="ttl">Cursor</span>
    <span class="trail" id="trail"><span class="dot run" id="dot"></span><span id="state">Working</span></span>
  </div>
  <div class="repo" id="repo"></div>
  <div class="term" id="term"></div>
  <div class="fin" id="fin"></div>
</div>
<script>
  var D = { status:"running", events:[], repo:"", runtime:"", model:"", elapsed:"",
            insertions:0, deletions:0, files:[], summary:"", prUrl:"", prNumber:0 };
  addEventListener("message", function(e){
    var m = e.data; if (!m || m.type !== "voiceos:init") return;
    document.documentElement.dataset.theme = (m.theme && m.theme.mode) || "dark";
    if (m.radius) document.documentElement.style.setProperty("--k-radius", m.radius+"px");
    D = Object.assign(D, m.data || {});
    render();
  });
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
  function glyph(kind){
    if (["edit","write","delete"].indexOf(kind)>=0) return "✎";
    if (["read","grep","glob","ls","semSearch"].indexOf(kind)>=0) return "◦";
    if (kind==="shell") return "›";
    if (kind==="thinking") return "∴";
    if (kind==="assistant") return "✎";
    return "◦";
  }
  function countUp(el,to,pre){ var s=performance.now(),d=550;
    (function st(t){ var p=Math.min(1,(t-s)/d),v=Math.round(to*(1-Math.pow(1-p,3)));
      el.innerHTML="<small>"+pre+"</small>"+v; if(p<1) requestAnimationFrame(st); })(performance.now());
  }
  function render(){
    var done = D.status==="done" || D.status==="failed";
    document.getElementById("dot").className = "dot "+(done?"done":"run");
    document.getElementById("state").textContent = done ? (D.prUrl?"PR opened":"Shipped")
                                                         : (D.elapsed||"Working");
    document.getElementById("repo").textContent =
      [D.repo, D.runtime, D.model].filter(Boolean).join("  ·  ");
    var term = document.getElementById("term"); term.innerHTML = "";
    var evs = (D.events||[]).slice(-14);
    evs.forEach(function(ev,i){
      var last = i===evs.length-1;
      var ln = document.createElement("div"); ln.className="ln";
      var gCls = done ? "ok" : (last ? "now" : "ok");
      var mark = done ? "✓" : (last ? glyph(ev.kind) : "✓");
      ln.innerHTML = '<span class="g '+gCls+'">'+mark+'</span><span class="ltxt">'+esc(ev.label)+
        (!done && last ? '<span class="caret"></span>' : '')+'</span>';
      term.appendChild(ln);
      setTimeout(function(){ ln.classList.add("in"); term.scrollTop=term.scrollHeight; report(); }, 40+i*55);
    });
    if (evs.length===0){
      var ln=document.createElement("div"); ln.className="ln in";
      ln.innerHTML='<span class="g now">›</span><span class="ltxt">starting agent<span class="caret"></span></span>';
      term.appendChild(ln);
    }
    var fin = document.getElementById("fin"); fin.innerHTML="";
    if (done){
      var nf=(D.files||[]).length, tot=(D.insertions||0)+(D.deletions||0)||1;
      var html='<div class="counts"><span class="num add" id="a"><small>+</small>0</span>'+
        '<span class="num del" id="d"><small>−</small>0</span>'+
        '<span class="fcount">'+(nf?nf+(nf===1?" file":" files"):"")+'</span></div>'+
        '<div class="bar"><i class="ba" id="ba"></i><i class="bd" id="bd"></i></div>'+
        '<div class="files" id="files"></div>';
      fin.innerHTML=html;
      var startDelay = 60 + evs.length*55;
      setTimeout(function(){
        countUp(document.getElementById("a"), D.insertions||0, "+");
        countUp(document.getElementById("d"), D.deletions||0, "−");
        document.getElementById("ba").style.width=(100*(D.insertions||0)/tot)+"%";
        document.getElementById("bd").style.width=(100*(D.deletions||0)/tot)+"%";
        var fw=document.getElementById("files");
        (D.files||[]).slice(0,6).forEach(function(f,i){
          var ft=(f.added+f.removed)||1, row=document.createElement("div"); row.className="f";
          row.innerHTML='<span class="fname">'+esc(f.name)+'</span>'+
            '<span class="fbar"><i class="ba" style="width:'+(100*f.added/ft)+'%"></i><i class="bd" style="width:'+(100*f.removed/ft)+'%"></i></span>'+
            '<span class="fnum"><b>+'+f.added+'</b> <s>−'+f.removed+'</s></span>';
          fw.appendChild(row);
          setTimeout(function(){ row.classList.add("in"); report(); }, i*70);
        });
        if (D.prUrl){
          var b=document.createElement("button"); b.className="pr";
          b.innerHTML='<svg width="13" height="13" viewBox="0 0 16 16" fill="#fff"><path d="M5 3.5a1.5 1.5 0 10-2 1.41v6.18a1.5 1.5 0 101 0V4.91A1.5 1.5 0 005 3.5zM11 3a3 3 0 00-3 3v4.09a1.5 1.5 0 101 0V6a2 2 0 012-2h1.09a1.5 1.5 0 100-1H11z"/></svg>'+
            (D.prNumber?"View PR #"+D.prNumber:"View pull request");
          b.onclick=function(){ parent.postMessage({type:"voiceos:openUrl",url:D.prUrl},"*"); };
          fin.appendChild(b);
        }
        report();
      }, startDelay);
    }
    report();
  }
  function report(){
    if (document.hidden || !document.documentElement.offsetWidth) return;
    var h=Math.ceil(document.querySelector(".card").getBoundingClientRect().height);
    if (h>=8) parent.postMessage({type:"voiceos:resize",height:h+2},"*");
  }
  new ResizeObserver(report).observe(document.documentElement);
</script>
